name: Backend CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: spacewhy_test
          POSTGRES_USER: spacewhy
          POSTGRES_PASSWORD: spacewhy_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spacewhy -d spacewhy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://spacewhy:spacewhy_test_password@127.0.0.1:5432/spacewhy_test
      DATABASE__URL: postgresql+asyncpg://spacewhy:spacewhy_test_password@127.0.0.1:5432/spacewhy_test
      APP__ENVIRONMENT: test
      LOGGING__JSON_LOGS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest tests/unit
      - run: uv run pytest tests/unit/core/test_bot_settings.py tests/unit/core/test_i18n.py tests/unit/bots
      - run: uv run pytest tests/architecture
      - run: uv run pytest tests/smoke
      - run: uv run pytest tests/smoke/test_bot_webhooks.py tests/smoke/test_http_i18n.py
      - run: uv run pytest tests/integration
      - run: uv run alembic upgrade head
      - run: uv run python scripts/check_migrations.py
      - run: docker build --tag spacewhy-backend:ci .
