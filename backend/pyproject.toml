[project]
name = "spacewhy-backend"
version = "0.1.0"
description = "Production-ready FastAPI foundation for Spacewhy"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiogram==3.30.0",
    "aiohttp==3.14.3",
    "alembic==1.19.1",
    "Babel==2.18.0",
    "asyncpg==0.31.0",
    "fastapi==0.141.1",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "SQLAlchemy[asyncio]==2.0.51",
    "uvicorn[standard]==0.52.3",
]

[dependency-groups]
dev = [
    "coverage[toml]==7.13.4",
    "httpx==0.28.1",
    "pyright==1.1.411",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.3",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
artifacts = ["src/app/core/i18n/locales/**/*.po"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "architecture: verifies architectural dependency boundaries",
    "integration: requires a real PostgreSQL database",
    "smoke: verifies the assembled ASGI application",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyright]
include = ["src", "tests", "migrations", "scripts"]
exclude = [".venv", "migrations/versions"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.coverage.run]
branch = true
source = ["src/app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
